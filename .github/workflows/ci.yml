name: CI

on:
  pull_request:
    branches: [main]

# Cancel an in-progress run when new commits are pushed to the same PR.
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      # Re-run with caching now that Corepack provides the pinned Yarn version.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Prettier
        run: yarn format:check

  check:
    name: ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        package: [frontend, backend]
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack (Yarn 4)
        run: corepack enable

      # Re-run with caching now that Corepack provides the pinned Yarn version.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Lint
        run: yarn lint

      - name: Type check
        run: ${{ matrix.package == 'frontend' && 'yarn tsc -b' || 'yarn tsc --noEmit' }}

      # Backend tests run against a local Supabase stack (Docker is available
      # on GitHub-hosted runners); see backend/test-db/.
      - name: Start test Supabase
        if: matrix.package == 'backend'
        run: |
          yarn db:test:start
          eval "$(yarn supabase status --workdir test-db -o env)"
          echo "SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"

      - name: Unit tests
        run: yarn test

      - name: E2E tests
        if: matrix.package == 'backend'
        run: yarn test:e2e

      - name: Build
        run: yarn build

  # The production deploy files (see deploy/ and README.md). Nothing here
  # touches AWS: it only checks the files.
  deploy:
    name: deploy files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: CloudFormation template (cfn-lint)
        run: |
          pip install 'cfn-lint==1.*'
          cfn-lint deploy/cloudformation.yaml

      - name: Shell scripts (shellcheck)
        run: shellcheck deploy/*.sh

      # Same nginx version as Ubuntu 24.04, with a throwaway certificate in
      # place of the Cloudflare origin certificate.
      - name: nginx config (nginx -t)
        run: |
          mkdir -p tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=test \
            -keyout tls/origin.key -out tls/origin.pem
          sed 's/__DOMAIN__/example.com/g' deploy/nginx.conf > site.conf
          docker run --rm \
            -v "$PWD/site.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/tls:/etc/pandanstreet/tls:ro" \
            nginx:1.24-alpine nginx -t
