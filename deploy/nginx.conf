# Installed by deploy/release.sh (__DOMAIN__ is replaced with the stack's domain).
# Edits on the server are overwritten by the next release.
#
# Cloudflare proxies both host names and connects here over HTTPS with SSL
# mode "Full (strict)", using the Cloudflare Origin Certificate below. The
# security group only lets Cloudflare's IP ranges reach port 443.

ssl_certificate /etc/pandanstreet/tls/origin.pem;
ssl_certificate_key /etc/pandanstreet/tls/origin.key;

# Any other host name (e.g. the bare IP) gets no TLS handshake.
server {
  listen 443 ssl http2 default_server;
  # Set per server: Ubuntu's nginx.conf already sets ssl_protocols (with TLS 1.0/1.1)
  # in the http block, and repeating it there only triggers a duplicate warning.
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_reject_handshake on;
}

# Frontend: the static build of the current release.
server {
  listen 443 ssl http2;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_name __DOMAIN__;

  root /opt/pandanstreet/current/frontend/dist;

  # Vite's hashed bundles never change, so they can be cached for good.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Client-side routes (e.g. /u/<username>) fall back to the app shell.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}

# API: the NestJS backend.
server {
  listen 443 ssl http2;
  ssl_protocols TLSv1.2 TLSv1.3;
  server_name api.__DOMAIN__;

  # Photos are capped at 5MB by the backend; leave room for the form fields.
  client_max_body_size 6m;

  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
